<h2>Newsletter Signup (Validation Demo)</h2>
<p>This page demonstrates a form with validation. Clicking 'Submit' doesn't always mean success.</p>

<form id="signup-form">
  <label for="email-input">Email:</label>
  <input id="email-input" type="email" placeholder="you@example.com" required>
  <button type="submit" id="submit-btn">Subscribe</button>
</form>

<div id="error-msg" class="error">Please enter a valid email address.</div>
<div id="success-msg" class="success">Thank you for subscribing!</div>

<script>
  document.getElementById('signup-form').addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent actual page reload for demo
    
    var emailInput = document.getElementById('email-input');
    var errorMsg = document.getElementById('error-msg');
    var successMsg = document.getElementById('success-msg');
    
    // Simple validation
    if (emailInput.checkValidity()) {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'block';
      
      // Best Practice: Push custom success event
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        'event': 'signup_success',
        'email_domain': emailInput.value.split('@')[1]
      });
      
      console.log('Form submitted successfully!');
    } else {
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
      console.log('Form submission failed validation.');
    }
  });
</script>
</body>
