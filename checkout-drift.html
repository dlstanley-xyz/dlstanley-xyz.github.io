<h2>Checkout (Drift Demo)</h2>
<p>This page simulates a website update where the button ID was changed/removed.</p>

<label for="value-input">Price</label>
<input id="value-input" type="number" step="0.01" placeholder="10.00">

<!-- Button no longer has ID 'buy-button' -->
<button class="btn-purchase">Buy</button>

<script>
  // Script updated to use class
  document.querySelector('.btn-purchase').addEventListener('click', function() {
    var price = document.getElementById('value-input').value;
    
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      'event': 'manual_purchase',
      'purchase_value': price,
      'currency': 'USD',
      'transaction_id': 'T_' + new Date().getTime()
    });
    
    console.log('DataLayer updated with purchase!');
    alert('Purchased for $' + price);
  });
</script>
</body>
